<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Cedar House</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dedfdf; }
    body { font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint { position: fixed; left: 18px; bottom: 16px; color: #52565a; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .02em; user-select: none; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="hint">Drag to orbit · scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdedfde);
    scene.fog = new THREE.Fog(0xdedfde, 32, 75);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(13.8, 10.1, 18.8);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.65, 0.25);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 9;
    controls.maxDistance = 34;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b6b0, 2.05));
    const sun = new THREE.DirectionalLight(0xfff7ed, 3.2);
    sun.position.set(-8, 15, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -15;
    sun.shadow.camera.right = 15;
    sun.shadow.camera.top = 17;
    sun.shadow.camera.bottom = -13;
    sun.shadow.normalBias = 0.025;
    sun.shadow.bias = -0.00015;
    scene.add(sun);

    const mat = (color, roughness = 0.82, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
    const white = mat(0xf0efeb, 0.91);
    const concrete = mat(0xd2d0cc, 0.94);
    const darkMetal = mat(0x24292d, 0.46, { metalness: 0.55 });
    const garageMat = mat(0x25282b, 0.83);
    const glass = new THREE.MeshPhysicalMaterial({ color: 0xb9c5cc, roughness: 0.16, metalness: 0.18, transparent: true, opacity: 0.3, transmission: 0.18, thickness: 0.08, side: THREE.DoubleSide });
    const glassRail = new THREE.MeshPhysicalMaterial({ color: 0xd8e1e5, roughness: 0.12, metalness: 0.08, transparent: true, opacity: 0.37, side: THREE.DoubleSide });

    // A fine, warm cedar grain with narrow vertical board joints.
    const woodCanvas = document.createElement('canvas');
    woodCanvas.width = 1024; woodCanvas.height = 1024;
    const ctx = woodCanvas.getContext('2d');
    ctx.fillStyle = '#b97846'; ctx.fillRect(0, 0, 1024, 1024);
    let seed = 91731;
    const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let x = 0; x < 1024; x += 32) {
      const tone = 176 + Math.floor(rand() * 35);
      ctx.fillStyle = `rgb(${tone},${Math.floor(tone * .64)},${Math.floor(tone * .42)})`;
      ctx.fillRect(x, 0, 30, 1024);
      ctx.fillStyle = 'rgba(72,43,26,.26)'; ctx.fillRect(x + 30, 0, 2, 1024);
      ctx.fillStyle = 'rgba(255,222,173,.18)'; ctx.fillRect(x + 2, 0, 1, 1024);
      for (let n = 0; n < 14; n++) {
        const gx = x + 4 + rand() * 24;
        ctx.strokeStyle = rand() > .5 ? 'rgba(94,54,30,.12)' : 'rgba(255,224,183,.13)';
        ctx.lineWidth = .5 + rand() * 1.2;
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.bezierCurveTo(gx - 3 + rand() * 6, 330, gx - 3 + rand() * 6, 680, gx + rand() * 2, 1024); ctx.stroke();
      }
    }
    const woodTexture = new THREE.CanvasTexture(woodCanvas);
    woodTexture.colorSpace = THREE.SRGBColorSpace;
    woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
    woodTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const wood = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.78 });

    function box(name, x, y, z, w, h, d, material, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.name = name; mesh.position.set(x, y + h / 2, z); mesh.castShadow = cast; mesh.receiveShadow = receive;
      scene.add(mesh); return mesh;
    }
    function bar(name, x, y, z, w, h, d, material) { return box(name, x, y, z, w, h, d, material); }

    // Ground and the broad lower, white stucco volume.
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat(0xe1e0de, 1));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.035; ground.receiveShadow = true; scene.add(ground);
    // The lower floor is a shell around the openings, so glazing reads as glass
    // with the furnishings visible behind it instead of a panel over solid wall.
    box('right side wall', 5.38, 0, 0, 0.28, 3.18, 6.15, white);
    box('rear wall of living room', 2.48, 0, -2.93, 5.98, 3.18, 0.30, white);
    box('living room roof fascia', 2.48, 3.02, 0.03, 6.05, 0.16, 6.15, white);
    // Cantilever support, side returns, and rear wall make a deep covered carport.
    box('carport left pier', -5.18, 0, 0.05, 0.34, 3.18, 6.0, white);
    box('carport inner return', -0.42, 0, -0.02, 0.34, 3.18, 6.12, white);
    box('carport rear wall', -2.8, 0, -2.83, 4.78, 3.18, 0.34, white);
    // Dark sectional garage door at the back of the carport, with subtle horizontal seams.
    box('recessed garage door', -3.02, 0.12, -2.63, 3.58, 2.66, 0.045, garageMat);
    for (let y = 0.52; y < 2.7; y += 0.43) bar('garage door seam', -3.02, y, -2.595, 3.56, 0.018, 0.012, mat(0x34383b, 0.8));

    // Upper cedar-clad volume; it projects left over the carport.
    box('upper cedar story', -0.12, 3.2, -0.02, 9.66, 4.03, 5.42, wood);
    // Deep dark fascia and a slim roof cap around the flat roof edge.
    box('upper roof slab', -0.12, 7.18, -0.02, 9.92, 0.18, 5.68, darkMetal);
    box('front parapet cap', -0.12, 7.30, 2.84, 9.95, 0.12, 0.16, mat(0x303438, 0.48, { metalness: 0.45 }));
    box('left parapet cap', -5.12, 7.30, -0.02, 0.16, 0.12, 5.72, mat(0x303438, 0.48, { metalness: 0.45 }));
    box('right parapet cap', 4.88, 7.30, -0.02, 0.16, 0.12, 5.72, mat(0x303438, 0.48, { metalness: 0.45 }));

    // Front window wall and its black aluminum frame.
    const winLeft = -0.18, winRight = 2.78, winBottom = 0.58, winTop = 2.88, winZ = 3.105;
    box('front stucco pier by glazing', -0.27, 0, 3.10, 0.30, 3.18, 0.22, white);
    box('wall below front glazing', 1.30, 0, 3.10, 2.96, winBottom, 0.22, white);
    box('wall above front glazing', 1.30, winTop, 3.10, 2.96, 3.18 - winTop, 0.22, white);
    box('stucco between window and entry', 2.90, 0, 3.10, 0.28, 3.18, 0.22, white);
    box('right front stucco return', 4.93, 0, 3.10, 1.00, 3.18, 0.22, white);
    box('window glass', (winLeft + winRight) / 2, winBottom, winZ, winRight - winLeft, winTop - winBottom, 0.035, glass, false, false);
    const frameW = 0.075;
    bar('window frame left', winLeft - frameW / 2, winBottom, winZ + 0.045, frameW, winTop - winBottom + frameW, 0.085, darkMetal);
    bar('window frame right', winRight + frameW / 2, winBottom, winZ + 0.045, frameW, winTop - winBottom + frameW, 0.085, darkMetal);
    bar('window frame head', (winLeft + winRight) / 2, winTop, winZ + 0.045, winRight - winLeft + 0.15, frameW, 0.085, darkMetal);
    bar('window frame sill', (winLeft + winRight) / 2, winBottom - frameW, winZ + 0.045, winRight - winLeft + 0.15, frameW, 0.085, darkMetal);
    [-0.18, 0.80, 1.78, 2.54].forEach((x, i) => bar(`window mullion ${i}`, x, winBottom, winZ + 0.06, 0.052, winTop - winBottom, 0.09, darkMetal));
    bar('window cross rail', 1.30, 1.18, winZ + 0.065, winRight - winLeft, 0.045, 0.09, darkMetal);
    // Low interior floor, back wall, and a quiet sofa/table silhouette visible through the glass.
    box('interior floor', 2.45, 0.02, 0.0, 5.9, 0.06, 5.55, mat(0xcac8c2, 0.92), false, true);
    box('interior rear wall', 2.45, 0.06, -2.72, 5.9, 2.92, 0.08, mat(0xe4e3df, 0.92), false, false);
    box('living room sofa base', 0.92, 0.08, -0.78, 1.42, 0.40, 0.72, mat(0xd5d3ce), false, false);
    box('living room sofa back', 0.92, 0.48, -1.08, 1.42, 0.48, 0.20, mat(0xd8d6d1), false, false);
    box('coffee table top', 2.1, 0.48, 0.35, 1.12, 0.08, 0.58, mat(0xb3a18d), false, false);
    for (const x of [1.68, 2.52]) for (const z of [0.13, 0.57]) box('coffee table leg', x, 0.08, z, 0.045, 0.40, 0.045, darkMetal, false, false);

    // Recessed cedar entrance door, black jamb and a simple vertical pull.
    box('door dark recess', 3.82, 0.34, 3.103, 1.28, 2.56, 0.10, darkMetal);
    box('cedar front door', 3.82, 0.40, 3.17, 1.05, 2.38, 0.035, wood);
    box('door pull', 4.18, 1.40, 3.23, 0.045, 0.52, 0.065, darkMetal);

    // Broad, low concrete steps and a straight approach path.
    for (let i = 0; i < 3; i++) {
      const rise = 0.16, depth = 0.52;
      box(`front step ${i + 1}`, 3.25, (2 - i) * rise, 3.50 + i * depth, 4.05, rise, 0.58, concrete);
    }
    box('front landing', 3.25, 0.36, 3.11, 4.12, 0.12, 0.58, concrete);
    box('concrete approach path', 3.25, 0.012, 6.05, 4.10, 0.10, 2.65, concrete);

    // Roof terrace on the back-right roof area, edged in clear glass and fine dark rails.
    box('roof terrace deck', 1.65, 7.31, -1.34, 5.38, 0.12, 2.45, mat(0x55595b, 0.72));
    const railY = 7.48, railH = 1.03;
    box('terrace glass rear', 1.65, railY, -2.60, 5.36, railH, 0.035, glassRail, false, false);
    box('terrace glass right', 4.34, railY, -1.34, 0.035, railH, 2.50, glassRail, false, false);
    box('terrace glass left', -1.04, railY, -1.34, 0.035, railH, 2.50, glassRail, false, false);
    for (const [x, z] of [[-1.04,-2.6],[1.65,-2.6],[4.34,-2.6],[-1.04,-0.08],[4.34,-0.08]]) {
      box('terrace railing post', x, 7.37, z, 0.055, 1.18, 0.055, darkMetal);
    }
    box('terrace top rail rear', 1.65, 8.50, -2.60, 5.48, 0.055, 0.07, darkMetal);
    box('terrace top rail right', 4.34, 8.50, -1.34, 0.07, 0.055, 2.56, darkMetal);
    box('terrace top rail left', -1.04, 8.50, -1.34, 0.07, 0.055, 2.56, darkMetal);

    // A clipped low hedge in front of the main glazing.
    const hedgeMat = mat(0x426b3e, 0.94);
    box('low hedge core', 1.23, 0.08, 3.92, 3.10, 0.42, 0.48, hedgeMat);
    for (let i = 0; i < 19; i++) {
      const x = -0.25 + i * 0.165;
      const shrub = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22 + (i % 3) * 0.018, 1), mat(i % 4 === 0 ? 0x527b49 : 0x426a3d, 0.95));
      shrub.position.set(x, 0.31 + (i % 2) * 0.045, 3.91 + ((i % 3) - 1) * 0.055);
      shrub.scale.set(1.0, 0.72, 1.05); shrub.castShadow = true; shrub.receiveShadow = true; scene.add(shrub);
    }

    // Small ornamental trees with slim trunks and layered leafy crowns.
    const trunkMat = mat(0x6b4b31, 0.94);
    const leafMats = [mat(0x647d52, 0.95), mat(0x74895d, 0.95), mat(0x526d45, 0.95)];
    function tree(x, z, scale = 1) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.075 * scale, 0.12 * scale, 1.75 * scale, 8), trunkMat);
      trunk.position.set(x, 0.88 * scale, z); trunk.castShadow = true; trunk.receiveShadow = true; scene.add(trunk);
      for (let i = 0; i < 10; i++) {
        const angle = i * 2.399;
        const y = (1.55 + (i % 4) * 0.34) * scale;
        const radius = (0.36 + (i % 3) * 0.12) * scale;
        const crown = new THREE.Mesh(new THREE.IcosahedronGeometry((0.42 + (i % 2) * 0.10) * scale, 1), leafMats[i % leafMats.length]);
        crown.position.set(x + Math.cos(angle) * radius, y, z + Math.sin(angle) * radius);
        crown.scale.set(1, 1.12, 0.92); crown.castShadow = true; crown.receiveShadow = true; scene.add(crown);
      }
      const top = new THREE.Mesh(new THREE.IcosahedronGeometry(0.54 * scale, 1), leafMats[1]);
      top.position.set(x, 2.55 * scale, z); top.castShadow = true; scene.add(top);
    }
    tree(-5.88, 1.75, 1.12);
    tree(-0.02, 4.45, 0.82);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
