<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern 2-Story House – Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d5d6d7; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 12px; bottom: 10px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #4a4d50; opacity: 0.75; user-select: none; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">Drag: orbit · Scroll: zoom · Right-drag: pan</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------
   Renderer / scene / camera
------------------------------------------------------------------- */
const BG = 0xd5d6d7;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 55, 130);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 400);
// 3/4 front view: facade faces the viewer, camera a bit to the right, above eye level
camera.position.set(9.0, 6.4, 19.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 2.9, -1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.49; // keep the camera above the ground plane
controls.update();

/* ------------------------------------------------------------------
   Procedural vertical wood-slat texture (canvas)
------------------------------------------------------------------- */
const SLAT_TILE = 1.0;   // metres covered by one texture tile
const SLATS_PER_TILE = 8;

function makeWoodTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const sw = size / SLATS_PER_TILE;
  for (let i = 0; i < SLATS_PER_TILE; i++) {
    const s = 0.9 + rnd() * 0.14;
    g.fillStyle = `rgb(${Math.round(197 * s)},${Math.round(142 * s)},${Math.round(92 * s)})`;
    g.fillRect(i * sw, 0, sw, size);

    // long vertical grain streaks
    for (let k = 0; k < 16; k++) {
      const x = i * sw + rnd() * sw;
      g.strokeStyle = `rgba(122,80,42,${0.06 + rnd() * 0.12})`;
      g.lineWidth = 0.6 + rnd() * 1.2;
      g.beginPath();
      g.moveTo(x, 0);
      for (let y = 0; y <= size; y += 32) g.lineTo(x + Math.sin(y * 0.02 + k) * 1.5, y);
      g.stroke();
    }

    // dark groove between boards
    g.fillStyle = 'rgba(70,42,22,0.55)';
    g.fillRect(i * sw, 0, 3, size);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

/* ------------------------------------------------------------------
   Materials
------------------------------------------------------------------- */
const woodTex = makeWoodTexture();
const M = {
  wood:     new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.75, metalness: 0 }),
  stucco:   new THREE.MeshStandardMaterial({ color: 0xf4f4f2, roughness: 0.95, metalness: 0 }),
  dark:     new THREE.MeshStandardMaterial({ color: 0x2b3034, roughness: 0.45, metalness: 0.3 }),
  frame:    new THREE.MeshStandardMaterial({ color: 0x1d2225, roughness: 0.35, metalness: 0.5 }),
  garage:   new THREE.MeshStandardMaterial({ color: 0x3a3e43, roughness: 0.6, metalness: 0.05 }),
  bulkhead: new THREE.MeshStandardMaterial({ color: 0x858b91, roughness: 0.7, metalness: 0.1 }),
  concrete: new THREE.MeshStandardMaterial({ color: 0xe2e3e3, roughness: 0.9, metalness: 0 }),
  driveway: new THREE.MeshStandardMaterial({ color: 0xc8caca, roughness: 0.95, metalness: 0 }),
  ground:   new THREE.MeshStandardMaterial({ color: 0xd2d3d3, roughness: 1.0, metalness: 0 }),
  glass:    new THREE.MeshPhysicalMaterial({
              color: 0xb9ccd6, roughness: 0.05, metalness: 0.0,
              transparent: true, opacity: 0.28, depthWrite: false
            }),
  bark:     new THREE.MeshStandardMaterial({ color: 0x6b5036, roughness: 0.95 }),
  leaf:     new THREE.MeshStandardMaterial({ color: 0x5b8a4a, roughness: 0.9 }),
  hedge:    new THREE.MeshStandardMaterial({ color: 0x4a7a40, roughness: 0.95 }),
};

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
// Axis-aligned box given by min/max corners. Optional wood UV scaling so
// the slat texture keeps a constant physical board width on every face.
function boxXYZ(x0, x1, y0, y1, z0, z1, mat, { wood = false, cast = true, receive = true } = {}) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const geo = new THREE.BoxGeometry(w, h, d);
  if (wood) {
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      const face = Math.floor(i / 4);
      let sx, sy;
      if (face < 2) { sx = d; sy = h; }        // +x / -x faces
      else if (face < 4) { sx = w; sy = d; }  // +y / -y faces
      else { sx = w; sy = h; }                // +z / -z faces
      uv.setXY(i, uv.getX(i) * sx / SLAT_TILE, uv.getY(i) * sy / SLAT_TILE);
    }
    uv.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

// Blobby shrub / canopy piece
function blob(x, y, z, r, mat, sy = 1) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 2), mat);
  m.position.set(x, y, z);
  m.scale.y = sy;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function tree(x, z, s = 1) {
  boxXYZ(x - 0.08 * s, x + 0.08 * s, 0, 1.9 * s, z - 0.08 * s, z + 0.08 * s, M.bark, { receive: false });
  const crowns = [
    [0.0, 2.4, 0.0, 0.95],
    [0.45, 2.85, 0.2, 0.72],
    [-0.4, 2.8, -0.25, 0.78],
    [0.1, 3.4, -0.1, 0.65],
    [-0.2, 2.05, 0.35, 0.6],
  ];
  for (const [dx, dy, dz, r] of crowns) blob(x + dx * s, dy * s, z + dz * s, r * s, M.leaf);
}

/* ------------------------------------------------------------------
   Lights
------------------------------------------------------------------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9b9c, 1.1));

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-8, 14, 10);
sun.target.position.set(0.5, 2.5, -1);
scene.add(sun, sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;

const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(10, 6, 6);
scene.add(fill);

/* ------------------------------------------------------------------
   Ground
------------------------------------------------------------------- */
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), M.ground);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

// Driveway / carport slab
boxXYZ(-4.6, -1.9, 0, 0.03, -3.6, 1.2, M.driveway);

/* ------------------------------------------------------------------
   Ground floor (white stucco)
   Front plane z = 0. Solid body sits behind z = -0.2; front wall
   pieces wrap the window and door openings.
------------------------------------------------------------------- */
boxXYZ(-2.0, 3.9, 0, 3.3, -5.5, -0.2, M.stucco);          // main body
boxXYZ(-2.0, 3.95, 3.3, 3.36, -5.5, 0.04, M.stucco);      // thin roof lip
const fw = (x0, x1, y0, y1) => boxXYZ(x0, x1, y0, y1, -0.2, 0, M.stucco);
fw(-2.0, -1.5, 0, 3.3);     // left of window
fw(-1.5, 2.0, 2.6, 3.3);    // above window
fw(-1.5, 2.0, 0, 0.1);      // below window
fw(2.0, 2.26, 0, 3.3);      // between window and door
fw(2.26, 3.18, 2.65, 3.3);  // above door
fw(3.18, 3.9, 0, 3.3);      // right of door

// Right-side wall stays solid; its face is the big white right plane.

/* ------------------------------------------------------------------
   Carport (left): roof slab, back wall with dark garage door, side wall
------------------------------------------------------------------- */
boxXYZ(-4.4, -1.95, 2.9, 3.15, -3.6, 0.3, M.stucco);   // carport roof slab
boxXYZ(-4.4, -2.0, 0, 2.9, -3.6, -3.4, M.stucco);      // back wall
boxXYZ(-4.4, -4.2, 0, 2.9, -3.6, 0.3, M.stucco);       // left side wall
boxXYZ(-2.9, -2.05, 0.02, 2.25, -3.41, -3.39, M.garage); // garage door
// subtle door panel seams
for (let i = 1; i < 4; i++) {
  const y = 0.02 + (2.23 / 4) * i;
  boxXYZ(-2.9, -2.05, y - 0.012, y + 0.012, -3.395, -3.385, M.dark, { cast: false });
}

/* ------------------------------------------------------------------
   Upper volume: vertical cedar boards, dark cap, cantilevered
------------------------------------------------------------------- */
boxXYZ(-3.9, 4.2, 3.3, 5.85, -4.0, 1.0, M.wood, { wood: true });   // wood box
boxXYZ(-4.0, 4.3, 5.85, 5.98, -4.1, 1.1, M.dark);                  // dark cap / parapet

/* ------------------------------------------------------------------
   Rooftop terrace: floor, bulkhead, glass railing
------------------------------------------------------------------- */
boxXYZ(0.4, 3.9, 5.98, 6.06, -3.9, -0.9, M.concrete);          // terrace floor
boxXYZ(1.3, 2.6, 5.98, 6.75, -3.4, -2.5, M.bulkhead);          // stair bulkhead

function railing(x0, x1, z0, z1, along = 'x') {
  const H0 = 6.06, H1 = 7.16;
  const isX = along === 'x';
  // glass infill
  if (isX) boxXYZ(x0, x1, H0, H1, z0 - 0.01, z0 + 0.01, M.glass, { cast: false, receive: false });
  else     boxXYZ(x0 - 0.01, x0 + 0.01, H0, H1, z0, z1, M.glass, { cast: false, receive: false });
  // top rail
  if (isX) boxXYZ(x0, x1, H1, H1 + 0.05, z0 - 0.03, z0 + 0.03, M.frame);
  else     boxXYZ(x0 - 0.03, x0 + 0.03, H1, H1 + 0.05, z0, z1, M.frame);
  // posts
  const span = isX ? x1 - x0 : z1 - z0;
  const n = Math.max(1, Math.round(span / 1.2));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    if (isX) {
      const px = x0 + (x1 - x0) * t;
      boxXYZ(px - 0.03, px + 0.03, H0, H1, z0 - 0.03, z0 + 0.03, M.frame, { cast: false });
    } else {
      const pz = z0 + (z1 - z0) * t;
      boxXYZ(x0 - 0.03, x0 + 0.03, H0, H1, pz - 0.03, pz + 0.03, M.frame, { cast: false });
    }
  }
}
railing(0.4, 3.9, -3.9, -3.9, 'x');   // back run
railing(3.9, 3.9, -3.9, -0.9, 'z');   // right run
railing(0.4, 0.4, -3.9, -0.9, 'z');   // left run

/* ------------------------------------------------------------------
   Windows: large black-framed glazing on the front facade
   Opening x: [-1.5, 2.0], y: [0.1, 2.6]
------------------------------------------------------------------- */
const WX0 = -1.5, WX1 = 2.0, WY0 = 0.1, WY1 = 2.6, T = 0.07;
// glass pane (sits in the opening)
boxXYZ(WX0, WX1, WY0, WY1, -0.12, -0.1, M.glass, { cast: false, receive: false });
// frame members
const bar = (x0, x1, y0, y1) => boxXYZ(x0, x1, y0, y1, -0.05, 0.06, M.frame, { cast: true });
bar(WX0, WX1, WY1 - T, WY1);            // head
bar(WX0, WX1, WY0, WY0 + T);            // sill
bar(WX0, WX0 + T, WY0, WY1);            // left jamb
bar(WX1 - T, WX1, WY0, WY1);            // right jamb
bar(-0.06, 0.02, WY0, WY1);             // mullion
bar(0.66, 0.74, WY0, WY1);              // mullion
bar(1.56, 1.63, WY0, WY1);              // mullion
bar(WX0, WX1, 0.82, 0.89);              // transom

/* ------------------------------------------------------------------
   Front door: vertical wood slats, black handle, dark frame
------------------------------------------------------------------- */
const DX0 = 2.26, DX1 = 3.18, DY1 = 2.65;
boxXYZ(DX0, DX1, 0, DY1, 0.0, 0.1, M.wood, { wood: true });
boxXYZ(DX0 - 0.05, DX0, 0, DY1 + 0.04, 0.0, 0.12, M.dark);     // frame left
boxXYZ(DX1, DX1 + 0.05, 0, DY1 + 0.04, 0.0, 0.12, M.dark);     // frame right
boxXYZ(DX0 - 0.05, DX1 + 0.05, DY1, DY1 + 0.04, 0.0, 0.12, M.dark); // frame head
boxXYZ(3.06, 3.10, 0.95, 1.45, 0.1, 0.17, M.dark, { cast: true }); // handle

/* ------------------------------------------------------------------
   Concrete front steps and path
------------------------------------------------------------------- */
boxXYZ(0.5, 3.6, 0, 0.51, 0.0, 0.35, M.concrete);    // top step
boxXYZ(0.5, 3.6, 0, 0.34, 0.35, 0.7, M.concrete);    // middle step
boxXYZ(0.5, 3.6, 0, 0.17, 0.7, 1.05, M.concrete);   // bottom step
boxXYZ(-0.9, 2.2, 0, 0.03, 1.4, 2.7, M.concrete);    // path slab

/* ------------------------------------------------------------------
   Hedge along the front, low trees
------------------------------------------------------------------- */
for (let i = 0; i < 9; i++) {
  const x = -2.0 + i * 0.36 + (i % 2) * 0.05;
  const r = 0.3 + ((i * 37) % 5) * 0.02;
  blob(x, r * 0.85, 0.95 + ((i * 13) % 3) * 0.06, r, M.hedge, 0.85);
}

tree(-1.15, 1.9, 0.95);   // front tree by the window
tree(-5.6, -1.8, 1.25);   // back-left tree beside the carport

/* ------------------------------------------------------------------
   Render loop
------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
